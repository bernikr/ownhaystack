[project]
name = "ownhaystack"
version = "0.1.3"
description = "OpenHaystack + Owntracks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "cryptography>=50.0.2",
  "paho-mqtt>=2.2.0",
  "pbkdf2>=1.3",
  "pycryptodome>=4.6.0",
  "python-dotenv>=1.2.4",
  "requests>=2.34.2",
  "srp>=1.0.22",
]

[dependency-groups]
dev = ["mypy>=2.4.1", "prek>=0.5.11", "ruff>=0.17.6"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  "D",                   # pydocstyle
  "CPY",                 # flake8-copyright
  "T20",                 # flake8-print
  "raise-vanilla-class", # Custom Exceptions
  "blanket-type-ignore", # Use specific rule codes when ignoring type issues
]

[tool.mypy]
strict = true
local_partial_types = true
allow_redefinition_new = true
